<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gacha Survivors</title>

<!--
  TAB ICON AND SOCIAL EMBED.

  Both assets are LOCAL FILES generated from the game's own sprite system
  (see the note in package.json / scratch tooling): the card is a slice of the
  real roster over the real stage-1 palette, and the favicon is the mascot's own
  bust. Nothing here reaches a CDN, an icon service or a font host, because
  tests/run.js greps this file for a remote origin and fails the build on one —
  and because a game whose whole premise is "open the folder and read all of it"
  should not fetch its own face from somebody else's server.

  og:image WANTS AN ABSOLUTE URL. Facebook, Discord, Slack and iMessage all
  resolve it against nothing — a relative path is silently dropped and you get a
  bare link. Set the two `content` values below to wherever this is hosted; they
  are left relative so the repo is honest about not knowing, and a relative card
  still works on the platforms that do resolve it (Twitter/X, Telegram).
-->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#0b0814">
<meta name="author" content="Studio8Heads">
<meta name="description" content="An anime bullet-heaven roguelike. Pull a roster of 28, build a kit out of whatever the level-up screen offers, and survive fifteen minutes of it. Zero dependencies, no build step.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Gacha Survivors">
<meta property="og:title" content="Gacha Survivors">
<meta property="og:description" content="An anime bullet-heaven roguelike. Pull a roster of 28, build a kit out of whatever the level-up screen offers, and survive fifteen minutes of it. Created by Studio8Heads.">
<meta property="og:image" content="social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A crowd of pixel-art character portraits from Gacha Survivors.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gacha Survivors">
<meta name="twitter:description" content="An anime bullet-heaven roguelike. Pull a roster of 28 and survive fifteen minutes. Created by Studio8Heads.">
<meta name="twitter:image" content="social-card.png">
<style>
  /*
    TYPOGRAPHY, AND WHY THERE IS NO @font-face HERE.
    ------------------------------------------------
    Two stacks, kept character-for-character in step with UI_FONT and
    DISPLAY_FONT in src/render/renderer.js — the canvas draws almost every
    string in this game, this stylesheet draws the four on the boot screen, and
    the two must not disagree or the splash is set in a different face from the
    menu it hands over to. There is a test that greps this file for a remote
    stylesheet and another that greps every source file for @import url and
    fonts.googleapis, so the game's display face has to be one the machine
    already has. A base64 @font-face would technically pass both greps and is
    still the wrong answer: 60-90KB of unreviewable payload, in a repository
    whose entire premise is that you can read all of it.
  */
  :root {
    --ui: 1;
    --font-ui: "Segoe UI Variable Text", "Segoe UI", Inter, "SF Pro Text",
               system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --font-display: Bahnschrift, "DIN Alternate", "Avenir Next Condensed",
                    "Roboto Condensed", "Segoe UI Variable Display",
                    "Franklin Gothic Medium", "Arial Narrow", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05060d;
    color: #e8ecf5; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font-ui);
  }
  #app { position: fixed; inset: 0; }
  canvas#game {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; image-rendering: -webkit-optimize-contrast;
  }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; z-index: 50;
    background: #05060d; transition: opacity .35s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  /* The wordmark. ui.wordmark() in src/ui/widgets.js reproduces this exact
     treatment on the canvas — same face, same tracking, same three stops in the
     same order — so the hub's header is visibly the same object the splash just
     showed, rather than a second, worse logo. */
  #boot h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 6vw, 64px); font-weight: 800; letter-spacing: .09em;
    background: linear-gradient(92deg, #ffd76a, #ff5fa2 46%, #6ad8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    /* With background-clip:text the glyphs are transparent, so the shadow is
       painted from the glyph shapes behind them — the same hard offset drop the
       canvas wordmark draws as its first pass. The cyan end has no contrast
       against #05060d without it. */
    text-shadow: 0 3px 0 rgba(4, 3, 10, .9);
  }
  /* The same three-stop rule the hub draws under its own wordmark. */
  #bootrule {
    width: min(420px, 70vw); height: 2px; margin-top: -8px;
    background: linear-gradient(90deg, #ffd76a 0 33.3%, #ff5fa2 33.3% 66.6%, #6ad8ff 66.6%);
    opacity: .85;
  }
  /* The empty part of the track was #1a1f33 on #05060d — a 1.5:1 difference,
     which is to say invisible. At 0% the bar simply was not there, so the boot
     screen showed no progress affordance at all until the first tick landed. */
  #bootbar {
    width: min(420px, 70vw); height: 7px; border-radius: 4px;
    background: #232a42; box-shadow: inset 0 0 0 1px rgba(150,170,225,.35); overflow: hidden;
  }
  #bootbar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #6ad8ff, #ff5fa2); transition: width .18s ease; }
  /* THE STATUS LINE, LIFTED OUT OF THE FAINT TIER.
     It was #9aa6c6 — the exact value src/ui/widgets.js calls PALETTE.textFaint,
     which is the THIRD text tier, meant for a caption sitting beside something
     brighter that is doing the actual talking. This is the only sentence on the
     boot screen. At 14px, uppercased and tracked out to .16em there is very
     little ink per glyph to carry the contrast, and the result read as switched
     off rather than as quiet. #d3ddf3 on #05060d is about 13.5:1 against the
     ~8:1 it was, and it matches the tier the running game uses for body copy. */
  #bootmsg {
    font-family: var(--font-display); font-size: 15px; font-weight: 600; color: #d3ddf3;
    letter-spacing: .16em; text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }
  /* THE CREDIT. Under the status line and quieter than it, because the boot
     screen has exactly one sentence doing the talking and this is not it. It
     lives here rather than on the canvas so it is present from the first
     painted frame — before the atlas has rasterised anything at all. */
  #bootby {
    margin-top: 22px;
    font-family: var(--font-ui); font-size: 12px; font-weight: 400;
    color: #6d7799; letter-spacing: .10em;
  }
  #bootby b { color: #9fb0d8; font-weight: 700; letter-spacing: .06em; }
  #fatal {
    position: absolute; inset: 0; z-index: 100; display: none; padding: 24px;
    overflow: auto; background: #12060c; color: #ffb4c6; font: 13px/1.5 ui-monospace, Consolas, monospace;
  }
  #fatal h2 { color: #ff6f91; font-size: 18px; margin-bottom: 10px; font-family: inherit; }
  #fatal pre { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="boot">
    <h1>GACHA SURVIVORS</h1>
    <div id="bootrule"></div>
    <div id="bootbar"><i></i></div>
    <div id="bootmsg">booting…</div>
    <div id="bootby">created by <b>Studio8Heads</b></div>
  </div>
  <div id="fatal"><h2>The run derailed.</h2><pre id="fatalmsg"></pre></div>
</div>
<script type="module">
  // Surface module-level failures instead of dying to a silent blank canvas.
  const showFatal = (msg) => {
    const el = document.getElementById('fatal');
    document.getElementById('fatalmsg').textContent = msg;
    el.style.display = 'block';
  };
  window.addEventListener('error', (e) => showFatal((e.error && e.error.stack) || e.message));
  window.addEventListener('unhandledrejection', (e) => showFatal(String((e.reason && e.reason.stack) || e.reason)));
  import('./src/main.js').catch((e) => showFatal(
    (e && e.stack ? e.stack : String(e)) +
    '\n\nIf this says "Cross origin requests are only supported for..." you opened' +
    '\nindex.html from the filesystem. ES modules need a server. Run:\n\n    npx serve .\n'
  ));
</script>
</body>
</html>
